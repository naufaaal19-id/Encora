services:
  - type: web
    name: encora
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /healthz
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: encora
      - key: NODE_VERSION
        value: 20
